module_name: Dynamixel

parameters:
    - group: Dynamixel
      definitions:
        DXL_EN:
            description:
                short: Start the Dynamixel tilt-servo driver at boot
                long: |
                    If enabled, the fmu-v6c board startup script (rc.board_extras) starts
                    the dynamixel driver in auto mode on TELEM3 (/dev/ttyS1, 1 Mbit/s,
                    servo IDs 1-4). In auto mode the driver enables torque by itself and
                    holds the servos at the neutral position (DXL_Sn_ZERO), and arming is
                    blocked until all servos report ready.
                    Disable this for bench tests where the driver is started manually.
            type: boolean
            default: 0
            reboot_required: true

        DXL_S${i}_ZERO:
            description:
                short: Dynamixel servo ${i} neutral position
                long: Raw Goal Position corresponding to a joint angle of zero radians.
            type: int32
            num_instances: 4
            instance_start: 1
            min: 0
            max: 4095
            default: 2048

        DXL_S${i}_DIR:
            description:
                short: Dynamixel servo ${i} joint direction
                long: Set to 1 for increasing raw position with positive joint angle, or -1 to reverse it.
            type: enum
            values:
                -1: Reverse
                1: Normal
            num_instances: 4
            instance_start: 1
            default: 1

        DXL_S${i}_MIN:
            description:
                short: Dynamixel servo ${i} minimum commanded position
                long: Lower raw Goal Position limit applied after joint-angle conversion.
            type: int32
            num_instances: 4
            instance_start: 1
            min: 0
            max: 4095
            default: 1592

        DXL_S${i}_MAX:
            description:
                short: Dynamixel servo ${i} maximum commanded position
                long: Upper raw Goal Position limit applied after joint-angle conversion.
            type: int32
            num_instances: 4
            instance_start: 1
            min: 0
            max: 4095
            default: 2504
